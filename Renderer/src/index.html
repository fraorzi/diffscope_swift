<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  /* This file declares no colour, no font, no size and no radius of its own — every value comes
     from `tokens.css`, which is the one file a design replaces. Enforced by a check, because a
     boundary nobody verifies lasts until the next edit. */

  html, body { margin: 0; height: 100%; font: var(--ds-text-size) var(--ds-font); }
  body { display: flex; flex-direction: column;
         background: var(--ds-bg); color: var(--ds-plain); }

  /* Which file this is, above everything it says about it. The path is what tells two files of
     the same name apart, so it is shown rather than hovered — the lesson DEC-058 paid for three
     times over. */
  #file-header { display: flex; gap: var(--ds-space-2); align-items: baseline;
                 padding: var(--ds-space-3) var(--ds-space-4);
                 border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  #file-path { color: var(--ds-dim); }
  #file-name { color: var(--ds-text); font-weight: var(--ds-weight-emphasis); }

  /* INV-4 lives here: every fallback and every withheld analysis is stated in this bar. A design
     may restyle it and may not remove it from the layout. */
  #notices { display: flex; gap: var(--ds-space-3);
             padding: var(--ds-space-3) var(--ds-space-4); flex-wrap: wrap;
             color: var(--ds-text);
             border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  .ds-chip { padding: var(--ds-space-1) var(--ds-space-4);
             border-radius: var(--ds-radius-chip); font-size: var(--ds-text-size-small);
             border: var(--ds-hairline-width) solid var(--ds-border-strong); }
  .ds-chip-alert { border-style: dashed; font-weight: var(--ds-weight-emphasis); }

  #stage { display: flex; flex: 1; min-height: 0; }
  /* One column instead of two (DEC-059). Only one of the two layouts holds a document at a
     time, so nothing is drawn twice and no probe counts a mark that is not on screen. */
  #unified { display: none; flex: 1; min-height: 0; background: var(--ds-code); }

  /* The rendered comparison (DEC-063). Four modes over two images that arrive as data: URLs and
     are drawn through <img>, never inlined — an SVG is repository content and can carry script. */
  #rendered { display: none; flex: 1; min-height: 0; flex-direction: column;
              background: var(--ds-code); }
  .ds-render-bar { display: flex; gap: var(--ds-space-3); align-items: baseline;
                   padding: var(--ds-space-3) var(--ds-space-4);
                   border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  .ds-render-mode { padding: var(--ds-space-1) var(--ds-space-3);
                    border: var(--ds-hairline-width) solid var(--ds-border);
                    border-radius: var(--ds-radius-badge); color: var(--ds-dim);
                    font-size: var(--ds-text-size-small); cursor: pointer; }
  .ds-render-mode[data-on="true"] { color: var(--ds-text); border-color: var(--ds-border-strong);
                                    font-weight: var(--ds-weight-emphasis); }
  /* A mode that cannot work here is disabled **with its reason beside it**, never hidden — the
     same rule an unavailable scope follows. */
  .ds-mode-off { border-style: dashed; color: var(--ds-faint); cursor: default; }
  .ds-render-summary { padding: var(--ds-space-3) var(--ds-space-4); color: var(--ds-text);
                       border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  .ds-render-stage { flex: 1; min-height: 0; display: flex; gap: var(--ds-space-4);
                     padding: var(--ds-space-4); }
  .ds-render-panel { flex: 1; min-width: 0; display: flex; flex-direction: column;
                     gap: var(--ds-space-2); }
  .ds-render-label { color: var(--ds-dim); font-size: var(--ds-text-size-small); }
  /* Transparency, at a grid and a scale deliberately unlike every change texture: an alpha change
     that reads as a change texture is a difference reported in the wrong language. */
  .ds-checker { flex: 1; min-height: 0; display: grid; place-items: center;
                position: relative; overflow: hidden;
                background-color: var(--ds-check-a);
                background-image:
                  linear-gradient(45deg, var(--ds-check-b) 25%, transparent 25% 75%, var(--ds-check-b) 75%),
                  linear-gradient(45deg, var(--ds-check-b) 25%, transparent 25% 75%, var(--ds-check-b) 75%);
                background-size: var(--ds-checker-size) var(--ds-checker-size);
                background-position: 0 0, var(--ds-checker-half) var(--ds-checker-half); }
  .ds-checker img { max-width: 100%; max-height: 100%; }
  .ds-render-overlay { position: absolute; inset: 0; display: grid; place-items: center; }
  .ds-pixel-mask { max-width: 100%; max-height: 100%;
                   outline: var(--ds-hairline-width) dashed var(--ds-mark); }

  /* The Blame and History lenses (DEC-061). Same file, same window, same gutter geometry — what
     changes is the question being answered, not where the code is. */
  #lens { display: none; flex: 1; min-height: 0; overflow: auto; background: var(--ds-code); }
  .ds-lens-row { display: flex; gap: var(--ds-space-4); padding: 0 var(--ds-space-4);
                 white-space: pre; }
  /* Uncommitted work is *marked*, never tinted: tint and texture belong to the change language,
     and a second meaning for them is a meaning nobody can read (DEC-061). */
  .ds-lens-uncommitted { border-left: var(--ds-gutter-edge-width) solid var(--ds-mark);
                         padding-left: calc(var(--ds-space-4) - var(--ds-gutter-edge-width)); }
  .ds-lens-sha { color: var(--ds-faint); }
  .ds-lens-who { color: var(--ds-dim); width: 14ch; overflow: hidden; }
  .ds-lens-when { color: var(--ds-faint); width: 12ch; }
  .ds-lens-line { color: var(--ds-faint); width: 5ch; text-align: right; }
  .ds-lens-text { color: var(--ds-plain); }
  .ds-lens-subject { color: var(--ds-text); }
  .ds-lens-refs { color: var(--ds-dim); }
  .ds-lens-header { padding: var(--ds-space-3) var(--ds-space-4); color: var(--ds-dim);
                    border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  #left, #right { flex: 1; min-width: 0; overflow: hidden; background: var(--ds-code);
                  border-right: var(--ds-hairline-width) solid var(--ds-border); }
  #right { border-right: none; }
  .cm-editor { height: 100%; background: var(--ds-code); color: var(--ds-plain); }
  .cm-editor .cm-scroller { overflow: auto; font: var(--ds-text-size) var(--ds-font); }

  #unrenderable { display: none; padding: var(--ds-space-6); white-space: pre-wrap;
                  color: var(--ds-dim); }

  /* Change meaning is carried by texture and underline, never by token colour (DEC-035). Each
     mark's texture is a different angle, weight and period, so they stay tellable apart in
     greyscale — which is the state a screenshot and a colour-blind reader are both in. */
  .ds-changed {
    background-image: var(--ds-tex-changed);
    text-decoration: underline;
    text-decoration-thickness: var(--ds-underline-thickness);
    text-underline-offset: var(--ds-underline-offset);
  }
  .ds-fallback {
    background-image: var(--ds-tex-fallback);
    text-decoration: underline dotted;
    text-decoration-thickness: var(--ds-underline-thickness);
    text-underline-offset: var(--ds-underline-offset);
  }
  .ds-moved {
    background-image: var(--ds-tex-moved);
    outline: var(--ds-hairline-width) dashed var(--ds-mark);
    outline-offset: calc(-1 * var(--ds-hairline-width));
  }
  /* Grouping quietens, it never hides: the underline stays, only its weight drops (DEC-017). */
  .ds-formatting {
    background-image: var(--ds-tex-format);
    text-decoration-style: dotted;
    text-decoration-thickness: var(--ds-underline-thickness-quiet);
  }
  .ds-behaviour {
    background-image: var(--ds-tex-behaviour);
    text-decoration-style: wavy;
  }
  /* An alignment the structural layer could not confirm (DEC-017 confidence indication). */
  .ds-uncertain {
    background-image: var(--ds-tex-ambiguous);
    text-decoration-style: dashed;
  }
  /* A difference that is real in the bytes and absent on screen (DEC-023). */
  .ds-invisible {
    background-image: var(--ds-tex-invisible);
    outline: var(--ds-hairline-width) dotted var(--ds-mark);
    outline-offset: var(--ds-hairline-width);
  }
  .ds-fold {
    display: block;
    padding: var(--ds-space-1) var(--ds-space-4);
    font-size: var(--ds-text-size-small);
    color: var(--ds-dim);
    border-top: var(--ds-hairline-width) dashed var(--ds-border-strong);
    border-bottom: var(--ds-hairline-width) dashed var(--ds-border-strong);
    background: var(--ds-fold);
    cursor: pointer;
  }
  /* A group holding real differences, not unchanged text (DEC-048) — so it is marked as
     changed content that happens to be grouped, and never reads as "nothing here". */
  .ds-fold-formatting {
    border-top-style: solid;
    border-bottom-style: solid;
    background-image: var(--ds-tex-format);
  }
  /* The gutter is the third carrier of change meaning (`12-…` §5.1), so it marks by shape —
     a solid edge against the text — rather than by colour, which DEC-035 forbids as a sole signal. */
  /* Descendant selectors, not bare class names: CodeMirror injects its own base theme through
     StyleModule, and `.cm-gutters { background: #f5f5f5 }` from that sheet was quietly winning —
     both gutters drew light on a black window until a snapshot was sampled pixel by pixel. */
  .cm-editor .cm-gutters { border-right: var(--ds-hairline-width) solid var(--ds-border);
                           background: var(--ds-fold); }
  .cm-editor .cm-lineNumbers .cm-gutterElement { padding: 0 var(--ds-space-3) 0 var(--ds-space-4);
                                                 color: var(--ds-faint); }
  .ds-gutter-changed { border-right: var(--ds-gutter-edge-width) solid var(--ds-mark);
                       color: var(--ds-text) !important;
                       font-weight: var(--ds-weight-emphasis); }

  /* The sign column: `+` and `−`, the shape that tells added from removed where there are no
     panes to do it. Load-bearing (`24-…` §3) — in unified this is the only part of the
     distinction that survives greyscale, so the tints below only reinforce it. */
  .ds-sign { display: inline-block; width: var(--ds-space-6);
             text-align: center; color: var(--ds-mark);
             font-weight: var(--ds-weight-emphasis); }
  .ds-line-add { background-color: var(--ds-tint-add); }
  .ds-line-del { background-color: var(--ds-tint-del); }
  .cm-editor .ds-gutter-old .cm-gutterElement,
  .cm-editor .ds-gutter-new .cm-gutterElement { padding: 0 var(--ds-space-2);
                                                color: var(--ds-faint); text-align: right; }
  .cm-editor .ds-gutter-sign .cm-gutterElement { padding: 0; }

  .ds-badge {
    font-size: var(--ds-text-size-tiny);
    padding: 0 var(--ds-space-2);
    margin-left: var(--ds-space-2);
    border-radius: var(--ds-radius-badge);
    border: var(--ds-hairline-width) solid var(--ds-border-strong);
    white-space: nowrap;
    vertical-align: baseline;
  }

  /* Motion (DEC-064). Until 2026-08-09 the rule was that nothing animates, and reduced motion was
     honoured by there being nothing to disable — a guarantee by construction. That is gone by
     decision, so what replaces it is this pair: every transition declared here, and every one of
     them switched off in the block below. The check refuses an animated property that is not.

     Nothing that carries meaning moves: a change mark is where the engine put it the moment the
     document arrives. What moves is the interface's own furniture — a notice appearing, a fold
     opening under the pointer. */
  #notices { transition: opacity var(--ds-motion-quick) var(--ds-motion-curve); }
  .ds-chip { transition: border-color var(--ds-motion-quick) var(--ds-motion-curve); }
  .ds-fold { transition: background-color var(--ds-motion-quick) var(--ds-motion-curve); }
  .ds-fold:hover { background-color: var(--ds-syn-active-line); }

  @media (prefers-reduced-motion: reduce) {
    /* Everything, not a list: a list is a thing that can be incomplete, and the one transition
       that is missing from it is the one a reader with vestibular sensitivity gets. */
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
      scroll-behavior: auto !important;
    }
  }

  /* Syntax owns hue, the change system owns shape (DEC-035, DEC-066). The classes are applied by
     CodeMirror from the highlight style in `main.js`; the colours stay here, so the one-file rule
     holds for the syntax theme too. */
  .cm-content { caret-color: var(--ds-syn-cursor); }
  .cm-activeLine { background: var(--ds-syn-active-line); }
  .cm-selectionBackground, ::selection { background: var(--ds-syn-selection); }
  .tok-keyword { color: var(--ds-syn-keyword); }
  .tok-type { color: var(--ds-syn-type); }
  .tok-string { color: var(--ds-syn-string); }
  .tok-number { color: var(--ds-syn-number); }
  .tok-function { color: var(--ds-syn-function); }
  .tok-comment { color: var(--ds-syn-comment); font-style: italic; }
  .tok-punctuation { color: var(--ds-syn-punctuation); }
  .tok-variable { color: var(--ds-syn-variable); }
  .tok-property { color: var(--ds-syn-property); }
  .tok-operator { color: var(--ds-syn-operator); }
  .tok-regex { color: var(--ds-syn-regex); }
  /* Invalid syntax carries a dotted underline as well: it is the one syntax class that means
     something is wrong, and a meaning may not rest on hue alone. */
  .tok-invalid { color: var(--ds-syn-invalid); text-decoration: underline dotted; }
</style>
</head>
<body>
  <div id="file-header"><span id="file-path"></span><span id="file-name"></span></div>
  <div id="notices"></div>
  <div id="stage">
    <div id="left"></div>
    <div id="right"></div>
  </div>
  <div id="unified"></div>
  <div id="lens"></div>
  <div id="rendered"></div>
  <pre id="unrenderable"></pre>
  <script src="renderer.js"></script>
</body>
</html>
