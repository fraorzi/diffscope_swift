<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  /* This file declares no colour, no font, no size and no radius of its own — every value comes
     from `tokens.css`, which is the one file a design replaces. Enforced by a check, because a
     boundary nobody verifies lasts until the next edit. */

  html, body { margin: 0; height: 100%; font: var(--ds-text-size) var(--ds-font); }
  body { display: flex; flex-direction: column;
         background: var(--ds-surface); color: var(--ds-ink); }

  /* INV-4 lives here: every fallback and every withheld analysis is stated in this bar. A design
     may restyle it and may not remove it from the layout. */
  #notices { display: flex; gap: var(--ds-space-3);
             padding: var(--ds-space-3) var(--ds-space-4); flex-wrap: wrap;
             border-bottom: var(--ds-border) solid var(--ds-hairline); }
  .ds-chip { padding: var(--ds-space-1) var(--ds-space-4);
             border-radius: var(--ds-radius-chip); font-size: var(--ds-text-size-small);
             border: var(--ds-border) solid var(--ds-hairline-strong); }
  .ds-chip-alert { border-style: dashed; font-weight: var(--ds-weight-emphasis); }

  #stage { display: flex; flex: 1; min-height: 0; }
  #left, #right { flex: 1; min-width: 0; overflow: hidden;
                  border-right: var(--ds-border) solid var(--ds-hairline); }
  #right { border-right: none; }
  .cm-editor { height: 100%; }
  .cm-scroller { overflow: auto; }

  #unrenderable { display: none; padding: var(--ds-space-6); white-space: pre-wrap; }

  /* Change meaning is carried by texture and underline, never by token colour (DEC-035). */
  .ds-changed {
    background: repeating-linear-gradient(
      var(--ds-hatch-angle),
      var(--ds-hatch-ink) 0 var(--ds-hatch-stripe),
      transparent var(--ds-hatch-stripe) var(--ds-hatch-gap));
    text-decoration: underline;
    text-decoration-thickness: var(--ds-underline-thickness);
    text-underline-offset: var(--ds-underline-offset);
  }
  .ds-fallback {
    background: var(--ds-fill);
    text-decoration: underline dotted;
    text-decoration-thickness: var(--ds-underline-thickness);
    text-underline-offset: var(--ds-underline-offset);
  }
  .ds-moved {
    outline: var(--ds-border) dashed var(--ds-outline-moved);
    outline-offset: calc(-1 * var(--ds-border));
  }
  /* Grouping quietens, it never hides: the underline stays, only its weight drops (DEC-017). */
  .ds-formatting {
    background: none;
    text-decoration-style: dotted;
    text-decoration-thickness: var(--ds-underline-thickness-quiet);
  }
  .ds-behaviour {
    text-decoration-style: wavy;
  }
  /* An alignment the structural layer could not confirm (DEC-017 confidence indication). */
  .ds-uncertain {
    text-decoration-style: dashed;
  }
  /* A difference that is real in the bytes and absent on screen (DEC-023). */
  .ds-invisible {
    outline: var(--ds-border) dotted var(--ds-outline-invisible);
    outline-offset: var(--ds-border);
  }
  .ds-fold {
    display: block;
    padding: var(--ds-space-1) var(--ds-space-4);
    font-size: var(--ds-text-size-small);
    border-top: var(--ds-border) dashed var(--ds-fold-border);
    border-bottom: var(--ds-border) dashed var(--ds-fold-border);
    background: var(--ds-fold-fill);
    cursor: pointer;
  }
  /* A group holding real differences, not unchanged text (DEC-048) — so it is marked as
     changed content that happens to be grouped, and never reads as "nothing here". */
  .ds-fold-formatting {
    border-top-style: solid;
    border-bottom-style: solid;
    background: repeating-linear-gradient(
      var(--ds-hatch-angle),
      var(--ds-hatch-ink-quiet) 0 var(--ds-hatch-stripe),
      transparent var(--ds-hatch-stripe) var(--ds-hatch-gap));
  }
  /* The gutter is the third carrier of change meaning (`12-…` §5.1), so it marks by shape —
     a solid edge against the text — rather than by colour, which DEC-035 forbids as a sole signal. */
  .cm-gutters { border-right: var(--ds-border) solid var(--ds-hairline);
                background: var(--ds-fill-quiet); }
  .cm-lineNumbers .cm-gutterElement { padding: 0 var(--ds-space-3) 0 var(--ds-space-4);
                                      color: var(--ds-ink-quiet); }
  .ds-gutter-changed { border-right: var(--ds-gutter-edge-width) solid var(--ds-gutter-edge);
                       color: var(--ds-ink) !important;
                       font-weight: var(--ds-weight-emphasis); }

  .ds-badge {
    font-size: var(--ds-text-size-tiny);
    padding: 0 var(--ds-space-2);
    margin-left: var(--ds-space-2);
    border-radius: var(--ds-radius-badge);
    border: var(--ds-border) solid var(--ds-hairline-strong);
    white-space: nowrap;
    vertical-align: baseline;
  }
</style>
</head>
<body>
  <div id="notices"></div>
  <div id="stage">
    <div id="left"></div>
    <div id="right"></div>
  </div>
  <pre id="unrenderable"></pre>
  <script src="renderer.js"></script>
</body>
</html>
