<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="terminal.css">
<style>
  /* Like `index.html`, this file declares no colour, no font and no size of its own — every value
     comes from `tokens.css`. The rules here are layout only. */
  html, body { margin: 0; height: 100%; background: var(--ds-term-bg); }
  body { display: flex; flex-direction: column; }
  /* The tab strip (DEC-067). A tab says which shell it is and where that shell says it is; the
     active one is marked by weight and an edge, never by colour alone (DEC-035). */
  #tabs { flex: none; display: flex; gap: var(--ds-space-1);
          padding: var(--ds-space-1) var(--ds-space-2);
          border-bottom: var(--ds-hairline-width) solid var(--ds-border); }
  .ds-term-tab { padding: var(--ds-space-1) var(--ds-space-3);
                 font: var(--ds-text-size-small) var(--ds-font);
                 color: var(--ds-faint); cursor: pointer;
                 border-bottom: var(--ds-gutter-edge-width) solid transparent; }
  .ds-term-tab[data-active="true"] { color: var(--ds-term-fg);
                                     font-weight: var(--ds-weight-emphasis);
                                     border-bottom-color: var(--ds-mark); }
  /* A shell that is not where the reader is looking says so, in the same dotted underline the
     single pane uses (DEC-056) — one meaning, one shape. */
  .ds-term-tab[data-diverged="true"] { text-decoration: underline dotted;
                                       text-underline-offset: var(--ds-underline-offset); }

  #grid { flex: 1; min-height: 0; padding: var(--ds-space-2); position: relative; }
  /* One instance per tab, all present, one shown: an emulator asked to forget its scrollback and
     reproduce it later gets the cursor wrong on the first full-screen program. */
  .ds-term-grid { position: absolute; inset: var(--ds-space-2); visibility: hidden; }
  .ds-term-grid[data-active="true"] { visibility: visible; }
  .xterm .xterm-viewport { overflow-y: auto; }

  /* The input line (T2). It is a real text field, which is where the macOS word and line motions
     come from — measured in T0 before any of this was built.

     **It is the grid's last line now** (DEC-089). It had a border, a surface of its own and its own
     padding, so at a prompt the reader saw the shell's prompt in the grid and a separate box under
     it — two places to type, with a caret in each. The row carries the terminal's own surface, the
     grid's own left inset and no seam, so the prompt drawn in `#prompt` continues the scrollback
     rather than sitting in a second control. */
  #input-row { display: flex; align-items: baseline; gap: 0;
               padding: 0 var(--ds-space-2) var(--ds-space-2);
               background: var(--ds-term-bg); }
  /* The shell's own prompt, withheld from the grid and drawn here instead. `pre`, because a prompt's
     spacing is the shell's and collapsing it would move what it drew. */
  #prompt { flex: none; white-space: pre;
            font: var(--ds-term-text-size) var(--ds-font); color: var(--ds-term-fg); }
  /* The two chips report *on* the line rather than being part of it, so they sit at the trailing
     edge — in front of them the row is one continuous command line. */
  #mode { flex: none; margin-left: var(--ds-space-4); padding: var(--ds-space-1) var(--ds-space-3);
          border: var(--ds-hairline-width) solid var(--ds-border-strong);
          border-radius: var(--ds-radius-chip);
          font: var(--ds-text-size-small) var(--ds-font);
          color: var(--ds-term-fg); white-space: nowrap; cursor: pointer; }
  /* Raw is a different state, not a worse one, so it is marked by shape rather than by colour
     alone (DEC-035). */
  #mode[data-raw="true"] { border-style: dashed; font-weight: var(--ds-weight-emphasis); }
  /* Where the shell says it is (OSC 7). When it disagrees with the reader's selection the chip
     says so in words — the pane must never imply the terminal is where the diff is. */
  #cwd { flex: none; padding: var(--ds-space-1) var(--ds-space-3);
         font: var(--ds-text-size-small) var(--ds-font); color: var(--ds-faint);
         white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  #cwd[data-diverged="true"] { color: var(--ds-term-fg);
                               text-decoration: underline dotted;
                               text-underline-offset: var(--ds-underline-offset); }
  /* No padding of its own: the caret has to sit exactly one character after the prompt, and any
     inset here is a gap the shell did not draw. */
  #line { flex: 1; min-width: 0; resize: none; overflow: hidden; padding: 0;
          border: none; outline: none; background: transparent;
          font: var(--ds-term-text-size) var(--ds-font);
          color: var(--ds-term-fg); }
  /* Motion (DEC-064): the mode chip changes as the keyboard's destination changes, and a change
     the reader did not ask for is worth a moment rather than a jump. Switched off below. */
  #mode { transition: border-color var(--ds-motion-quick) var(--ds-motion-curve),
                      font-weight var(--ds-motion-quick) var(--ds-motion-curve); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  /* Hidden, never removed: a row that leaves the layout takes its own explanation with it. In a raw
     mode the prompt goes with the field — there is nothing inline to continue, and a prompt beside
     a field nobody can type in is the second place to type all over again. */
  #input-row[data-hidden="true"] #line,
  #input-row[data-hidden="true"] #prompt { visibility: hidden; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="grid"></div>
<div id="input-row"><span id="prompt"></span><textarea id="line" rows="1"
  spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Command line"></textarea><span
  id="mode"></span><span id="cwd" title=""></span></div>
<script src="terminal.js"></script>
</body>
</html>
